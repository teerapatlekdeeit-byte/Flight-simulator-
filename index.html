<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>teerapatlekdeeit-byte games</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0e1a2b;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .game-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      padding: 20px;
    }
    a {
      display: block;
      padding: 18px 28px;
      border-radius: 12px;
      background: #2a77c9;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    a:hover {
      background: #368ce8;
      transform: translateY(-2px);
    }
    a:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <h1>teerapatlekdeeit-byte games</h1>
  <div class="game-list">
    <a href="flight-sim/">✈️ Flight Simulator</a>
  </div>
</body>
</html>
